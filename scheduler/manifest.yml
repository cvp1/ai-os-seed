# scheduler/manifest.yml — the scheduler's source of truth.
#
# One entry per scheduled job. `scheduler/sync.sh` reconciles the real
# scheduler (crontab on Linux, launchd on macOS) to match this file. Edit
# here, then run `sync.sh`; never hand-edit crontab or a launchd .plist.
# `sync.sh --check` reports drift without fixing it.
#
# Fields:
#   name      unique job id; also the --job key log_run.py records and the
#             key freshness.json's "jobs" map looks up.
#   schedule  5-field cron expression. Only "*/N * * * *" (N divides 60),
#             "M H * * *" and "M H * * D" translate to launchd; anything
#             else is refused at sync time.
#   command   the full command line, already wrapped through
#             observability/log_run.py (see below). An unwrapped job still
#             runs but never appears in runs.db or freshness.
#
# Example — uncomment and fix SEED_ROOT to try the seed's own demo job:
#
# jobs:
#   - name: hello_fleet
#     schedule: "*/15 * * * *"
#     command: >-
#       /usr/bin/python3 <SEED_ROOT>/observability/log_run.py --job hello_fleet --
#       /usr/bin/python3 <SEED_ROOT>/demo/hello_fleet.py
#
# A second example — the weekly derived view (views/weekly.py). Scheduled
# off the hour (Monday 05:45) so jobs don't all fire at once.
#
# jobs:
#   - name: weekly_view
#     schedule: "45 5 * * 1"
#     command: >-
#       /usr/bin/python3 <SEED_ROOT>/observability/log_run.py --job weekly_view --
#       /usr/bin/python3 <SEED_ROOT>/views/weekly.py

# Opt-in watchers that ship with the seed but are off until you add them
# (fix SEED_ROOT, uncomment, add a freshness.json entry — or let
# stage_drift propose one — then run sync.sh):
#
# jobs:
#   - name: stage_drift        # scheduled job with no freshness entry -> staged proposal
#     schedule: "5 7 * * 1"
#     command: >-
#       /usr/bin/python3 <SEED_ROOT>/observability/log_run.py --job stage_drift --
#       /usr/bin/python3 <SEED_ROOT>/scheduler/stage_drift.py
#   - name: mcp_guard          # MCP launch-surface drift (run `guard.py snapshot` first)
#     schedule: "30 6 * * 1"
#     command: >-
#       /usr/bin/python3 <SEED_ROOT>/observability/log_run.py --job mcp_guard --
#       /usr/bin/python3 <SEED_ROOT>/mcp-guard/guard.py check
#   - name: friction_miner     # at most one automation idea a week
#     schedule: "45 6 * * 1"
#     command: >-
#       /usr/bin/python3 <SEED_ROOT>/observability/log_run.py --job friction_miner --
#       /usr/bin/python3 <SEED_ROOT>/friction-miner/miner.py run
#   - name: learn_sleep        # quarantined memory harvest; set LEARN_SOURCES first
#     schedule: "40 6 * * *"
#     command: >-
#       /usr/bin/python3 <SEED_ROOT>/observability/log_run.py --job learn_sleep --
#       /usr/bin/python3 <SEED_ROOT>/memory-mesh/learn_harvest.py --nightly

jobs: []
