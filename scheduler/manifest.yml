# scheduler/manifest.yml — the scheduler's source of truth (SEED-014).
#
# One entry per scheduled job. `scheduler/sync.sh` reads this file and
# reconciles the REAL scheduler (crontab on Linux, launchd on macOS) to
# match it. Add, edit, or remove an entry here, then run `sync.sh` — never
# hand-edit crontab or a launchd .plist directly; `sync.sh --check` will
# catch and report that drift, never silently fix it.
#
# Fields:
#   name      unique job id — also the --job key log_run.py records into
#             runs.db and the key freshness.json's "jobs" map looks up.
#   schedule  a standard 5-field cron expression (minute hour dom month
#             dow). Translated automatically to the macOS launchd
#             equivalent; only two shapes translate today — "*/N * * * *"
#             (every N minutes, N a divisor of 60) and a fixed "M H * * *"
#             or "M H * * D" (daily/weekly at one time). Anything else is
#             refused at sync time with a clear message rather than
#             silently mis-scheduled.
#   command   the FULL command line, already wrapped through
#             observability/log_run.py (see the example below) — sync.sh
#             does not add this wrapping for you. An unwrapped job still
#             runs; it just never appears in runs.db or freshness.
#
# Example — uncomment and fix SEED_ROOT to try the seed's own demo job:
#
# jobs:
#   - name: hello_fleet
#     schedule: "*/15 * * * *"
#     command: >-
#       /usr/bin/python3 <SEED_ROOT>/observability/log_run.py --job hello_fleet --
#       /usr/bin/python3 <SEED_ROOT>/demo/hello_fleet.py
#
# A second example — your first REAL (non-demo) job: the weekly derived
# view (views/weekly.py, SEED-054). Scheduled off the hour/day-boundary on
# purpose (Monday 05:45, not 06:00) — a habit worth keeping once you have
# more than one weekly job: everything firing on the dot piles up and any
# one delay cascades into the next.
#
# jobs:
#   - name: weekly_view
#     schedule: "45 5 * * 1"
#     command: >-
#       /usr/bin/python3 <SEED_ROOT>/observability/log_run.py --job weekly_view --
#       /usr/bin/python3 <SEED_ROOT>/views/weekly.py

# Opt-in watchers that ship with the seed but are off until you add them
# (fix SEED_ROOT, uncomment, add a freshness.json entry — or let
# stage_drift propose one — then run sync.sh):
#
# jobs:
#   - name: stage_drift        # scheduled job with no freshness entry -> staged proposal
#     schedule: "5 7 * * 1"
#     command: >-
#       /usr/bin/python3 <SEED_ROOT>/observability/log_run.py --job stage_drift --
#       /usr/bin/python3 <SEED_ROOT>/scheduler/stage_drift.py
#   - name: mcp_guard          # MCP launch-surface drift (run `guard.py snapshot` first)
#     schedule: "30 6 * * 1"
#     command: >-
#       /usr/bin/python3 <SEED_ROOT>/observability/log_run.py --job mcp_guard --
#       /usr/bin/python3 <SEED_ROOT>/mcp-guard/guard.py check
#   - name: friction_miner     # at most one automation idea a week
#     schedule: "45 6 * * 1"
#     command: >-
#       /usr/bin/python3 <SEED_ROOT>/observability/log_run.py --job friction_miner --
#       /usr/bin/python3 <SEED_ROOT>/friction-miner/miner.py run
#   - name: learn_sleep        # quarantined memory harvest; set LEARN_SOURCES first
#     schedule: "40 6 * * *"
#     command: >-
#       /usr/bin/python3 <SEED_ROOT>/observability/log_run.py --job learn_sleep --
#       /usr/bin/python3 <SEED_ROOT>/memory-mesh/learn_harvest.py --nightly

jobs: []
