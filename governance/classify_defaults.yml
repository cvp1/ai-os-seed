# Pattern library — SEED-061. The compiler's concrete tool/command
# classification engine: maps a real Claude Code tool/command PATTERN to
# (surface, reversibility). This is separate from policy.yml's own
# `surfaces.*.classify` blocks, which describe the matrix in human/schema
# terms; this file is what the compiler actually pattern-matches against
# at build time. An org edits policy.yml (the matrix); this file is the
# seed's shipped default engine and is edited only to extend tool coverage.
#
# Any tool/command pattern NOT listed here is UNCLASSIFIED to the compiler
# (regardless of policy.yml's descriptive surface defaults) and compiles to
# `ask`, named explicitly in COMPILE-REPORT.md's "default-deny" section —
# this is the mechanism, not an oversight (default-deny per the artifact's
# operating rules).
#
# Fields: pattern (Claude Code permission-rule syntax), surface,
# reversibility, note (optional, explains a non-obvious call).

entries:
  # --- private workspace: read-only + in-place edits, locally revertible
  - pattern: "Read"
    surface: private_workspace
    reversibility: reversible
  - pattern: "Glob"
    surface: private_workspace
    reversibility: reversible
  - pattern: "Grep"
    surface: private_workspace
    reversibility: reversible
  - pattern: "Edit"
    surface: private_workspace
    reversibility: reversible
    note: "in-workspace file edit — undo = git checkout / re-edit"
  - pattern: "Write"
    surface: private_workspace
    reversibility: reversible
  - pattern: "NotebookEdit"
    surface: private_workspace
    reversibility: reversible
  - pattern: "WebFetch"
    surface: private_workspace
    reversibility: reversible
    note: "read-only network fetch; egress_first_party_only still applies at its own layer"
  - pattern: "WebSearch"
    surface: private_workspace
    reversibility: reversible
  - pattern: "Bash(rm:*)"
    surface: private_workspace
    reversibility: irreversible
    note: "deletion inside the workspace is still irreversible — no undo"
  - pattern: "Bash(git commit:*)"
    surface: team_shared
    reversibility: reversible
    note: "commit=reversible per the artifact's worked example — local history, easily undone before push"

  # --- team-shared: visible to colleagues, socially/technically undoable
  - pattern: "Bash(git push:*)"
    surface: team_shared
    reversibility: costly
    note: "push=costly — needs a second push or a colleague's cooperation to undo"
  - pattern: "Bash(git push --force*)"
    surface: team_shared
    reversibility: irreversible
    note: "force-push=irreversible — can rewrite/destroy others' history"
  - pattern: "Bash(git merge:*)"
    surface: team_shared
    reversibility: costly

  # --- external: anything a third party sees, or money
  - pattern: "mcp__*mail*send*"
    surface: external
    reversibility: irreversible
    note: "outbound mail — matches composio/gmail/outlook send-style connectors"
  - pattern: "mcp__*publish*"
    surface: external
    reversibility: irreversible
  - pattern: "Bash(gh release create:*)"
    surface: external
    reversibility: irreversible
  - pattern: "Bash(npm publish:*)"
    surface: external
    reversibility: irreversible
  - pattern: "mcp__*spend*"
    surface: external
    reversibility: irreversible
    note: "payment/spend-shaped tools — money is always external (v0.2)"
  - pattern: "mcp__*calendar*create_event*"
    surface: team_shared
    reversibility: reversible
    note: "internal calendar create; promotion to external happens at the connector-arg level, see SCOPES.md"
