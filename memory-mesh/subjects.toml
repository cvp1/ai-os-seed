# Subject registry: the controlled vocabulary for event subjects, so that
# contradictions on one subject can be detected. The fold parks any event
# whose subject class is not registered here.
#
# Shape: <class>/<entity>. Host entities must use canonical fleet slugs.

[classes]
ssh-route = "reachability of a host over ssh (entity = fleet slug)"
endpoint = "a network service location (entity = service name)"
install = "presence/version of a tool on a host (entity = host.tool)"
policy = "a rule encoded in code or doctrine (entity = doc-or-module.key)"
lesson = "a behavioral lesson (entity = kebab slug, same as memory slugs)"
capability = "what a host or component can do (entity = host.capability)"
home = "a canonical fact artifact being watched (entity = doc name)"
