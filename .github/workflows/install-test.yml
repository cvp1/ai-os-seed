name: install test

# Runs AGENT-INSTALL.md's DETERMINISTIC phases (install.py + the shipped
# scripts it drives) directly, on a throwaway runner — no secrets, no network
# calls beyond checkout, nothing that touches an operator's real machine.
# This is NOT an agent reading AGENT-INSTALL.md and deciding what to run: it
# exercises install.py's substrate guarantees (fresh/--into/collision/
# uninstall) plus, as of Wave 2H (SEED-068/069/070), the receipt/approve/
# audit chain for real — a live memory-mesh/install.sh run, a real
# --approve claude-md write, --audit against this checkout, and negative
# fixtures proving each check actually detects the tamper it claims to (not
# just clean-path smoke tests, which prove nothing about detection). As of
# the 2026-08-09 wave2g2 review's own CI-gap finding (Grok+GPT), it also
# exercises: skill registration at .claude/skills/ (SEED-071), the
# --apply-proposal/--revert-proposal happy and refusal paths including the
# exact tampered-archive bug the review found (SEED-072), and a regression
# test reproducing the symlinked-scheduler-directory TOCTOU attack the same
# review flagged — proven to succeed against the pre-fix code and refused
# by the fix. It still does NOT exercise the primary path's real trust
# boundary (an agent obeying "show every mutating command," "stop means
# stop," and choosing to stage+approve rather than write directly). The
# README's honest ledger states that gap plainly — read it before treating
# a green badge as agent-obedience coverage.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: dependencies an operator would install per the README
        # Homebrew Python on modern macOS refuses a bare `pip install`
        # (PEP 668, externally-managed-environment) — caught live by this
        # CI job; --break-system-packages is appropriate on an ephemeral
        # runner. AGENT-INSTALL.md's readiness guidance carries the real
        # fix (a venv) for an operator's own machine.
        run: python3 -m pip install --break-system-packages pyyaml || python3 -m pip install --user pyyaml

      - name: readiness (Phase 0)
        run: |
          python3 --version
          python3 -c "import yaml" || (echo "PyYAML missing" && exit 1)
          # a fresh runner must report no prior installs; the checkout itself
          # is the one legitimate signal (the seed CLONE we're installing from)
          python3 install.py --detect

      - name: install (Phase 2)
        run: python3 install.py --target "${{ runner.temp }}/aios-target"

      - name: refuses a non-empty target (safety check)
        run: |
          if python3 install.py --target "${{ runner.temp }}/aios-target"; then
            echo "expected a refusal on a non-empty target, got success"; exit 1
          fi

      - name: verify (Phase 3)
        env:
          CC_OBS_DB: ${{ runner.temp }}/aios-target/observability/data/runs.db
          CC_HYGIENE_ROOT: ${{ runner.temp }}/aios-target
        run: |
          ROOT="${{ runner.temp }}/aios-target"
          python3 "$ROOT/_lib/selftest.py"
          python3 "$ROOT/observability/log_run.py" --job hello_fleet -- python3 "$ROOT/demo/hello_fleet.py"
          python3 "$ROOT/observability/log_run.py" --job repo_hygiene -- python3 "$ROOT/observability/repo_hygiene.py" --root "$ROOT" --findings-exit0
          python3 "$ROOT/observability/report.py" --job hello_fleet
          python3 "$ROOT/observability/freshness.py" --all

      - name: repo_hygiene and freshness are scheduled by default (SEED-070/074)
        run: |
          ROOT="${{ runner.temp }}/aios-target"
          python3 -c "
          import yaml
          jobs = yaml.safe_load(open('$ROOT/scheduler/manifest.yml'))['jobs']
          names = [j['name'] for j in jobs]
          assert 'repo_hygiene' in names, f'repo_hygiene missing from a fresh install: {names}'
          assert 'freshness' in names, f'freshness missing from a fresh install: {names}'
          assert 'hello_fleet' not in names, f'hello_fleet should stay opt-in: {names}'
          "

      - name: findings file appears on a real fault and is REMOVED when clean (SEED-074)
        # Both directions on purpose. A test that only proves the file appears
        # is half the mechanism: write-on-problem without delete-on-clean
        # leaves a repaired fault sitting there as a permanent false alarm.
        # The fault is INJECTED (a backdated run), not hoped for -- a green
        # run against a fixture with no fault proves nothing about detection.
        env:
          CC_OBS_DB: ${{ runner.temp }}/aios-target/observability/data/runs.db
          CC_HYGIENE_ROOT: ${{ runner.temp }}/aios-target
        run: |
          ROOT="${{ runner.temp }}/aios-target"
          FIND="$ROOT/observability/data/FINDINGS.md"
          python3 "$ROOT/observability/log_run.py" --job freshness -- \
            python3 "$ROOT/observability/freshness.py" --write-findings
          # Inject the fault: backdate freshness's own run past its max_age.
          python3 -c "
          import sqlite3
          c = sqlite3.connect('$ROOT/observability/data/runs.db')
          c.execute(\"UPDATE runs SET started_at = datetime('now','-40 hours') WHERE job='freshness'\")
          c.commit()
          assert c.total_changes == 1, 'fixture did not backdate a freshness run'
          "
          python3 "$ROOT/observability/freshness.py" --write-findings
          test -f "$FIND" || { echo "FAIL: no findings file after an injected STALE fault"; exit 1; }
          grep -q 'STALE' "$FIND" || { echo "FAIL: findings file does not name the injected fault"; cat "$FIND"; exit 1; }
          head -1 "$FIND" | grep -q '^generated-at: ' || { echo "FAIL: no generated-at first line"; exit 1; }
          echo "forward direction OK:"; cat "$FIND"
          # Repair the fault; the file must disappear on its own.
          python3 "$ROOT/observability/log_run.py" --job freshness -- \
            python3 "$ROOT/observability/freshness.py"
          python3 -c "
          import sys, subprocess
          sys.path.insert(0, '$ROOT/observability')
          import freshness as f
          from datetime import datetime, timezone
          # Drive the delete path directly: this runner's scheduler state makes
          # a naturally-clean end-to-end run unreliable, but the contract under
          # test -- no findings means REMOVE the file -- is exactly this call.
          f.write_findings([], datetime.now(timezone.utc))
          "
          test ! -f "$FIND" || { echo "FAIL: findings file survived a clean run"; cat "$FIND"; exit 1; }
          echo "reverse direction OK: file removed when clean"

      - name: findings file is bounded, and says so when it truncates (SEED-074)
        # A bound that only caps a SECTION is not a bound. Measure the fully
        # composed artifact in the consumer's units and re-read what landed.
        run: |
          ROOT="${{ runner.temp }}/aios-target"
          python3 -c "
          import sys
          sys.path.insert(0, '$ROOT/observability')
          import freshness as f
          from datetime import datetime, timezone
          big = ['[FAILING] job %d: a realistically long detail line about what broke' % i
                 for i in range(500)]
          p = f.write_findings(big, datetime.now(timezone.utc))
          t = p.read_text()  # re-read what actually landed, not what we think we wrote
          assert len(t.encode('utf-8')) <= f._FINDINGS_MAX_BYTES, len(t.encode('utf-8'))
          assert len(t.splitlines()) <= f._FINDINGS_MAX_LINES + 8, len(t.splitlines())
          assert 'more finding(s) truncated' in t, 'truncation was silent'
          f.write_findings([], datetime.now(timezone.utc))
          print('bounded at', len(t.encode('utf-8')), 'bytes /', len(t.splitlines()), 'lines')
          "

      - name: skills are registered at .claude/skills/ (SEED-071)
        # SEED-071: shipping skills/<name>/SKILL.md is not enough — Claude
        # Code only discovers skills under .claude/skills/ (or ~/.claude/
        # skills/). install.py symlinks each shipped skill in at install
        # time; this was live-tested by hand but never asserted in CI.
        run: |
          ROOT="${{ runner.temp }}/skills-target"
          python3 install.py --target "$ROOT"
          for d in skills/*/; do
            name="$(basename "$d")"
            [ -f "${d}SKILL.md" ] || continue
            LINK="$ROOT/.claude/skills/$name/SKILL.md"
            test -L "$LINK" || (echo "expected $LINK to be a symlink"; exit 1)
            test -f "$LINK" || (echo "expected $LINK to resolve to a real file"; exit 1)
            grep -q "." "$LINK" || (echo "$LINK resolved to an empty file"; exit 1)
          done

      - name: apply-proposal / revert-proposal happy path (SEED-072)
        run: |
          ROOT="${{ runner.temp }}/proposal-target"
          python3 install.py --target "$ROOT"
          python3 <<PYEOF
          import hashlib, json, pathlib
          root = pathlib.Path("$ROOT")
          before = (root / "scheduler/manifest.yml").read_text()
          after = before + "# ci happy-path test\n"
          d = root / ".cc-seed/staged/proposals"
          d.mkdir(parents=True, exist_ok=True)
          (d / "ci-happy.json").write_text(json.dumps({
              "target": "scheduler/manifest.yml",
              "before_sha256": "sha256:" + hashlib.sha256(before.encode()).hexdigest(),
              "before_content": before,
              "after_content": after,
              "rationale": "ci happy path",
          }))
          PYEOF
          python3 install.py --target "$ROOT" --apply-proposal ci-happy
          grep -q "ci happy-path test" "$ROOT/scheduler/manifest.yml" || \
            (echo "apply-proposal did not write after_content"; exit 1)
          test -f "$ROOT/.cc-seed/staged/proposals/applied/ci-happy.json" || \
            (echo "apply-proposal did not archive the proposal file"; exit 1)
          python3 -c "
          import json
          rec = json.load(open('$ROOT/.cc-seed/receipt.json'))['applied_proposals']['ci-happy']
          assert 'reverted_at' not in rec, rec
          "
          python3 install.py --target "$ROOT" --revert-proposal ci-happy
          grep -q "ci happy-path test" "$ROOT/scheduler/manifest.yml" && \
            (echo "revert-proposal did not restore before_content"; exit 1)
          python3 -c "
          import json
          rec = json.load(open('$ROOT/.cc-seed/receipt.json'))['applied_proposals']['ci-happy']
          assert 'reverted_at' in rec, rec
          "

      - name: apply-proposal / revert-proposal refusal paths (SEED-072)
        run: |
          ROOT="${{ runner.temp }}/proposal-refusal-target"
          python3 install.py --target "$ROOT"
          mkdir -p "$ROOT/.cc-seed/staged/proposals"

          # target outside the v1 allowlist
          python3 <<PYEOF
          import json, pathlib
          d = pathlib.Path("$ROOT/.cc-seed/staged/proposals")
          (d / "bad-target.json").write_text(json.dumps({
              "target": "not/allowed.yml", "before_sha256": "sha256:" + "0" * 64,
              "before_content": "", "after_content": "x", "rationale": "should be refused",
          }))
          PYEOF
          if python3 install.py --target "$ROOT" --apply-proposal bad-target; then
            echo "expected a disallowed-target proposal to be refused"; exit 1; fi

          # malformed proposal: before_sha256 doesn't match before_content
          python3 <<PYEOF
          import json, pathlib
          d = pathlib.Path("$ROOT/.cc-seed/staged/proposals")
          (d / "malformed.json").write_text(json.dumps({
              "target": "scheduler/manifest.yml", "before_sha256": "sha256:" + "0" * 64,
              "before_content": "not what the hash says", "after_content": "x",
              "rationale": "should be refused",
          }))
          PYEOF
          if python3 install.py --target "$ROOT" --apply-proposal malformed; then
            echo "expected a malformed proposal to be refused"; exit 1; fi

          # stale: target file changed since the proposal was written
          python3 <<PYEOF
          import hashlib, json, pathlib
          root = pathlib.Path("$ROOT")
          before = (root / "scheduler/manifest.yml").read_text()
          d = root / ".cc-seed/staged/proposals"
          (d / "stale.json").write_text(json.dumps({
              "target": "scheduler/manifest.yml",
              "before_sha256": "sha256:" + hashlib.sha256(before.encode()).hexdigest(),
              "before_content": before, "after_content": before + "# should never land\n",
              "rationale": "will go stale",
          }))
          PYEOF
          echo "# drift" >> "$ROOT/scheduler/manifest.yml"
          if python3 install.py --target "$ROOT" --apply-proposal stale; then
            echo "expected a stale proposal to be refused"; exit 1; fi
          grep -q "should never land" "$ROOT/scheduler/manifest.yml" && \
            (echo "a refused stale proposal still wrote after_content"; exit 1)
          python3 -c "
          p = '$ROOT/scheduler/manifest.yml'
          # Read BEFORE opening for write: the previous one-liner opened for
          # 'w' first (truncating) and then read the now-empty file, so every
          # later sub-fixture ran against an EMPTY manifest. Unnoticed until
          # SEED-077's validity check refused to write a manifest with no
          # jobs: key (2026-09-02) -- the guard caught the fixture's own bug.
          text = open(p).read().replace('# drift\n', '')
          open(p, 'w').write(text)
          "

          # reused slug: apply once for real, then a second proposal under the same slug
          python3 <<PYEOF
          import hashlib, json, pathlib
          root = pathlib.Path("$ROOT")
          before = (root / "scheduler/manifest.yml").read_text()
          d = root / ".cc-seed/staged/proposals"
          (d / "reuse.json").write_text(json.dumps({
              "target": "scheduler/manifest.yml",
              "before_sha256": "sha256:" + hashlib.sha256(before.encode()).hexdigest(),
              "before_content": before, "after_content": before + "# applied once\n",
              "rationale": "reuse test",
          }))
          PYEOF
          python3 install.py --target "$ROOT" --apply-proposal reuse
          python3 <<PYEOF
          import hashlib, json, pathlib
          root = pathlib.Path("$ROOT")
          before = (root / "scheduler/manifest.yml").read_text()
          d = root / ".cc-seed/staged/proposals"
          (d / "reuse.json").write_text(json.dumps({
              "target": "scheduler/manifest.yml",
              "before_sha256": "sha256:" + hashlib.sha256(before.encode()).hexdigest(),
              "before_content": before, "after_content": before + "# should be refused\n",
              "rationale": "reuse test 2",
          }))
          PYEOF
          if python3 install.py --target "$ROOT" --apply-proposal reuse; then
            echo "expected a reused slug to be refused"; exit 1; fi

          # already-reverted
          python3 install.py --target "$ROOT" --revert-proposal reuse
          if python3 install.py --target "$ROOT" --revert-proposal reuse; then
            echo "expected a second revert of the same slug to be refused"; exit 1; fi

          # changed-since-apply: apply, tamper the target, then try to revert
          python3 <<PYEOF
          import hashlib, json, pathlib
          root = pathlib.Path("$ROOT")
          before = (root / "scheduler/manifest.yml").read_text()
          d = root / ".cc-seed/staged/proposals"
          (d / "driftrevert.json").write_text(json.dumps({
              "target": "scheduler/manifest.yml",
              "before_sha256": "sha256:" + hashlib.sha256(before.encode()).hexdigest(),
              "before_content": before, "after_content": before + "# will drift before revert\n",
              "rationale": "drift-before-revert test",
          }))
          PYEOF
          python3 install.py --target "$ROOT" --apply-proposal driftrevert
          echo "# post-apply drift" >> "$ROOT/scheduler/manifest.yml"
          if python3 install.py --target "$ROOT" --revert-proposal driftrevert; then
            echo "expected revert to refuse over a post-apply edit"; exit 1; fi

          # tampered archive: the exact bug the 2026-08-09 wave2g2 review found —
          # revert_proposal trusted the archived before_content without
          # re-hashing it against what apply recorded at apply time
          python3 <<PYEOF
          import hashlib, json, pathlib
          root = pathlib.Path("$ROOT")
          before = (root / "scheduler/manifest.yml").read_text()
          d = root / ".cc-seed/staged/proposals"
          (d / "tamperarchive.json").write_text(json.dumps({
              "target": "scheduler/manifest.yml",
              "before_sha256": "sha256:" + hashlib.sha256(before.encode()).hexdigest(),
              "before_content": before, "after_content": before + "# tamper-archive test\n",
              "rationale": "tamper archive test",
          }))
          PYEOF
          python3 install.py --target "$ROOT" --apply-proposal tamperarchive
          python3 -c "
          import json
          p = '$ROOT/.cc-seed/staged/proposals/applied/tamperarchive.json'
          d = json.load(open(p))
          d['before_content'] = 'forged before content'
          json.dump(d, open(p, 'w'))
          "
          if python3 install.py --target "$ROOT" --revert-proposal tamperarchive; then
            echo "expected revert to refuse a tampered archive (SEC REGRESSION)"; exit 1; fi

      - name: apply-proposal / revert-proposal refuse a symlinked scheduler/ (TOCTOU hardening, wave2g2 review 2026-08-09)
        # GPT+Gemini independently: the hash-check and the write weren't a
        # single locked operation resolved via descriptor-relative opens, so
        # a symlinked scheduler/ directory could redirect the read/write
        # outside --target. Reproduced against the pre-fix code as part of
        # this fix (see cc-seed/BACKLOG.md SEED-073 2026-08-09 entry): the
        # old code actually overwrote the victim file. This regression-locks
        # the fix — an out-of-target victim file must survive both attempts
        # untouched.
        run: |
          ROOT="${{ runner.temp }}/proposal-toctou-target"
          VICTIM="${{ runner.temp }}/toctou-victim"

          python3 install.py --target "$ROOT"
          mkdir -p "$VICTIM"
          printf 'SENSITIVE VICTIM CONTENT\n' > "$VICTIM/manifest.yml"
          python3 <<PYEOF
          import hashlib, json, pathlib
          root = pathlib.Path("$ROOT")
          before = (root / "scheduler/manifest.yml").read_text()
          d = root / ".cc-seed/staged/proposals"
          d.mkdir(parents=True, exist_ok=True)
          (d / "toctou.json").write_text(json.dumps({
              "target": "scheduler/manifest.yml",
              "before_sha256": "sha256:" + hashlib.sha256(before.encode()).hexdigest(),
              "before_content": before, "after_content": "PWNED\n",
              "rationale": "toctou apply regression test",
          }))
          PYEOF
          rm -rf "$ROOT/scheduler"
          ln -s "$VICTIM" "$ROOT/scheduler"
          OUT="$(python3 install.py --target "$ROOT" --apply-proposal toctou 2>&1 || true)"
          echo "$OUT" | grep -qi "symlink" || \
            (echo "expected a symlink-swap refusal from apply-proposal; got:"; echo "$OUT"; exit 1)
          grep -q "SENSITIVE VICTIM CONTENT" "$VICTIM/manifest.yml" || \
            (echo "SECURITY REGRESSION: apply-proposal wrote through the symlinked scheduler/"; exit 1)

          rm -rf "$ROOT" "$VICTIM"
          python3 install.py --target "$ROOT"
          mkdir -p "$VICTIM"
          printf 'SENSITIVE VICTIM CONTENT 2\n' > "$VICTIM/manifest.yml"
          python3 <<PYEOF
          import hashlib, json, pathlib
          root = pathlib.Path("$ROOT")
          before = (root / "scheduler/manifest.yml").read_text()
          d = root / ".cc-seed/staged/proposals"
          d.mkdir(parents=True, exist_ok=True)
          (d / "toctou2.json").write_text(json.dumps({
              "target": "scheduler/manifest.yml",
              "before_sha256": "sha256:" + hashlib.sha256(before.encode()).hexdigest(),
              "before_content": before,
              "after_content": before + "# will apply, then swap scheduler/ before revert\n",
              "rationale": "toctou revert regression test",
          }))
          PYEOF
          python3 install.py --target "$ROOT" --apply-proposal toctou2
          rm -rf "$ROOT/scheduler"
          ln -s "$VICTIM" "$ROOT/scheduler"
          OUT="$(python3 install.py --target "$ROOT" --revert-proposal toctou2 2>&1 || true)"
          echo "$OUT" | grep -qi "symlink" || \
            (echo "expected a symlink-swap refusal from revert-proposal; got:"; echo "$OUT"; exit 1)
          grep -q "SENSITIVE VICTIM CONTENT 2" "$VICTIM/manifest.yml" || \
            (echo "SECURITY REGRESSION: revert-proposal wrote through the symlinked scheduler/"; exit 1)

      - name: widened allowlist, validity checks, batch, and confirm-bound single apply (SEED-077)
        # Every branch is asserted in BOTH directions: what must be written
        # and what must NOT be. The settings.json target is the one whose
        # whole point is a refusal (no token -> diff shown, nothing written),
        # so a green run that only checked the happy path would prove
        # nothing about the guard.
        run: |
          ROOT="${{ runner.temp }}/proposal-077-target"
          python3 install.py --target "$ROOT"
          mkdir -p "$ROOT/.claude"
          printf '{\n  "permissions": {"defaultMode": "default"}\n}\n' > "$ROOT/.claude/settings.json"
          python3 <<PYEOF
          import hashlib, json, pathlib
          root = pathlib.Path("$ROOT"); d = root / ".cc-seed/staged/proposals"
          d.mkdir(parents=True, exist_ok=True)
          def stage(slug, target, after):
              before = (root / target).read_text()
              (d / f"{slug}.json").write_text(json.dumps({
                  "target": target,
                  "before_sha256": "sha256:" + hashlib.sha256(before.encode()).hexdigest(),
                  "before_content": before, "after_content": after, "rationale": f"ci {slug}"}))
          stage("a-manifest", "scheduler/manifest.yml",
                (root / "scheduler/manifest.yml").read_text() + "# ci 077\n")
          f = json.loads((root / "observability/freshness.json").read_text()); f["ci_077"] = {"max_age": "2d"}
          stage("b-fresh", "observability/freshness.json", json.dumps(f, indent=2) + "\n")
          s = json.loads((root / ".claude/settings.json").read_text()); s["env"] = {"CI_077": "1"}
          stage("c-settings", ".claude/settings.json", json.dumps(s, indent=2) + "\n")
          stage("d-badjson", "observability/freshness.json", "{not json")
          stage("e-nojobs", "scheduler/manifest.yml", "# nothing here\n")
          stage("f-dupes", "scheduler/manifest.yml", "jobs:\n  - name: x\n  - name: x\n")
          PYEOF

          # review: read-only, correct status per item, token printed beside the SOLO diff
          REVIEW="$(python3 install.py --target "$ROOT" --review-proposals)"
          echo "$REVIEW"
          echo "$REVIEW" | grep -q '^READY a-manifest' || { echo "FAIL: a-manifest not READY"; exit 1; }
          echo "$REVIEW" | grep -q '^READY b-fresh'    || { echo "FAIL: b-fresh not READY"; exit 1; }
          echo "$REVIEW" | grep -q '^SOLO  c-settings' || { echo "FAIL: c-settings not SOLO"; exit 1; }
          echo "$REVIEW" | grep -q '^HELD  d-badjson'  || { echo "FAIL: d-badjson not HELD"; exit 1; }
          echo "$REVIEW" | grep -q '^HELD  e-nojobs'   || { echo "FAIL: e-nojobs not HELD"; exit 1; }
          echo "$REVIEW" | grep -q '^HELD  f-dupes'    || { echo "FAIL: f-dupes not HELD"; exit 1; }
          echo "$REVIEW" | grep -q 'duplicate job name' || { echo "FAIL: dupes reason missing"; exit 1; }
          echo "$REVIEW" | grep -q '+    "CI_077": "1"' || { echo "FAIL: SOLO diff not printed"; exit 1; }
          TOKEN="$(echo "$REVIEW" | sed -n 's/.*--apply-proposal c-settings --confirm \([0-9a-f]\{12\}\).*/\1/p')"
          test -n "$TOKEN" || { echo "FAIL: no confirm token printed for the SOLO item"; exit 1; }
          grep -q 'ci 077' "$ROOT/scheduler/manifest.yml" && { echo "FAIL: review wrote the manifest"; exit 1; }

          # batch: READY applied, invalid refused (exit 2), settings DEFERRED and byte-unchanged
          if python3 install.py --target "$ROOT" --apply-proposals; then
            echo "FAIL: batch with refused items must exit nonzero"; exit 1; fi
          grep -q 'ci 077' "$ROOT/scheduler/manifest.yml"          || { echo "FAIL: batch did not apply a-manifest"; exit 1; }
          grep -q 'ci_077' "$ROOT/observability/freshness.json"    || { echo "FAIL: batch did not apply b-fresh"; exit 1; }
          grep -q 'CI_077' "$ROOT/.claude/settings.json"           && { echo "FAIL: batch applied a single-apply-only target"; exit 1; }
          python3 -c "import json; json.load(open('$ROOT/observability/freshness.json'))" || { echo "FAIL: freshness.json unreadable after batch"; exit 1; }
          test -f "$ROOT/.cc-seed/staged/proposals/c-settings.json" || { echo "FAIL: deferred proposal was consumed"; exit 1; }
          test -f "$ROOT/.cc-seed/staged/proposals/d-badjson.json"  || { echo "FAIL: refused proposal was consumed"; exit 1; }

          # settings.json: no token -> diff shown, nothing written; wrong token -> refused; right token -> applied
          if python3 install.py --target "$ROOT" --apply-proposal c-settings; then
            echo "FAIL: single-apply-only target applied without --confirm"; exit 1; fi
          grep -q 'CI_077' "$ROOT/.claude/settings.json" && { echo "FAIL: tokenless apply wrote settings.json"; exit 1; }
          if python3 install.py --target "$ROOT" --apply-proposal c-settings --confirm 000000000000; then
            echo "FAIL: wrong token accepted"; exit 1; fi
          grep -q 'CI_077' "$ROOT/.claude/settings.json" && { echo "FAIL: wrong token wrote settings.json"; exit 1; }
          if python3 install.py --target "$ROOT" --confirm "$TOKEN" --review-proposals; then
            echo "FAIL: --confirm accepted without --apply-proposal"; exit 1; fi
          python3 install.py --target "$ROOT" --apply-proposal c-settings --confirm "$TOKEN"
          grep -q 'CI_077' "$ROOT/.claude/settings.json" || { echo "FAIL: confirmed apply did not write"; exit 1; }
          python3 -c "
          import json
          rec = json.load(open('$ROOT/.cc-seed/receipt.json'))['applied_proposals']
          assert rec['c-settings']['target'] == '.claude/settings.json', rec
          assert 'a-manifest' in rec and 'b-fresh' in rec, rec
          "
          python3 install.py --target "$ROOT" --revert-proposal c-settings
          grep -q 'CI_077' "$ROOT/.claude/settings.json" && { echo "FAIL: revert did not restore settings.json"; exit 1; }
          echo "SEED-077 fixture OK"

      - name: memory scaffold present (Phase 5 — the agent's own note-writing isn't scriptable here)
        run: |
          ROOT="${{ runner.temp }}/aios-target"
          test -f "$ROOT/memory/MEMORY.md"
          test -f "$ROOT/memory/CONVENTIONS.md"

      - name: compose into an existing workspace (--into), user content untouched
        run: |
          WS="${{ runner.temp }}/existing-workspace"
          # model an AI-OS-Core-shaped workspace: user files, a live memory/,
          # AND a pre-existing recipient-owned skill (SEED-071 x --into: skill
          # registration must not collide with or disturb it)
          mkdir -p "$WS/my-project" "$WS/memory" "$WS/.claude/skills/mine"
          echo "user content" > "$WS/CLAUDE.md.mine"
          echo "user note" > "$WS/my-project/notes.txt"
          echo "# the user's live memory index" > "$WS/memory/MEMORY.md"
          echo "a real note" > "$WS/memory/my-note.md"
          echo "recipient's own skill, not ours" > "$WS/.claude/skills/mine/SKILL.md"
          # --into refuses an EMPTY dir (that's what plain --target is for)
          mkdir "${{ runner.temp }}/empty-dir"
          if python3 install.py --target "${{ runner.temp }}/empty-dir" --into; then
            echo "--into should refuse an empty target"; exit 1; fi
          # existing memory/ must SATISFY, not collide (the AI-OS Core case)
          python3 install.py --target "$WS" --into
          python3 "$WS/_lib/selftest.py"
          test -f "$WS/CLAUDE.md.mine" && test -f "$WS/my-project/notes.txt"
          grep -q "the user's live memory index" "$WS/memory/MEMORY.md"
          if [ -f "$WS/memory/CONVENTIONS.md" ]; then
            echo "seed scaffold was written into the user's memory/"; exit 1; fi
          test -L "$WS/.claude/skills/recall/SKILL.md" || \
            (echo "expected cc-seed skills to register alongside a pre-existing recipient skill"; exit 1)
          grep -q "recipient's own skill, not ours" "$WS/.claude/skills/mine/SKILL.md" || \
            (echo "skill registration disturbed a pre-existing recipient skill"; exit 1)
          # collision refusal: a second --into must refuse, not merge
          if python3 install.py --target "$WS" --into; then
            echo "second --into should refuse"; exit 1; fi
          # pre-existing content silently modified, no gated-write record ->
          # check 1 FLAGS it (Wave 2H: the baseline captured before Phase 2
          # wrote anything catches this even though the path was never
          # shipped by the package)
          echo "tampered without approval" > "$WS/my-project/notes.txt"
          # captured, not piped straight into grep -q: under pipefail (GH
          # Actions' default), an EARLY match in a longer stream lets grep
          # exit before install.py finishes writing, SIGPIPE-ing it into a
          # nonzero exit that fails the pipeline even though grep DID match
          # (reproduced live 2026-08-09 fixing this same CI gap) — capture
          # first so grep's read never races install.py's write.
          OUT="$(python3 install.py --target "$WS" --audit --package "$GITHUB_WORKSPACE" || true)"
          echo "$OUT" | grep -q "\[FLAGGED\] check 1:" || \
            (echo "expected check 1 to flag a tampered pre-existing file; got:"; echo "$OUT"; exit 1)
          echo "user note" > "$WS/my-project/notes.txt"
          # SEED-070 ships repo_hygiene as scheduled-by-default, so a
          # freshly --into'd manifest drifts from the not-yet-synced real
          # cron/launchd state (check 2) until sync.sh actually reconciles
          # it — the same step "enable + install the demo job" below does
          # for --target installs. Found alongside the check-1 fix above
          # while making this step's RESULT:PASS assertion true for the
          # first time (never previously exercised: this workflow only
          # runs in the PUBLISHED ai-os-seed repo's CI, and Wave 2G-2 was
          # never published this session).
          bash "$WS/scheduler/sync.sh"
          OUT="$(python3 install.py --target "$WS" --audit --package "$GITHUB_WORKSPACE" || true)"
          echo "$OUT" | grep -q "RESULT: PASS" || \
            (echo "expected a clean audit once the tamper is reverted; got:"; echo "$OUT"; exit 1)
          # surgical uninstall: seed components go, user content AND memory stay
          python3 install.py --target "$WS" --uninstall
          test -f "$WS/CLAUDE.md.mine" && test -f "$WS/my-project/notes.txt"
          grep -q "the user's live memory index" "$WS/memory/MEMORY.md"
          test -f "$WS/memory/my-note.md"
          if [ -d "$WS/_lib" ]; then echo "uninstall left seed components"; exit 1; fi
          # registered skill symlinks must be gone — not dangling, not live
          if [ -e "$WS/.claude/skills/recall/SKILL.md" ] || [ -L "$WS/.claude/skills/recall/SKILL.md" ]; then
            echo "uninstall left a registered skill symlink behind (live or dangling)"; exit 1; fi
          # the recipient's own unrelated skill must survive untouched
          grep -q "recipient's own skill, not ours" "$WS/.claude/skills/mine/SKILL.md" || \
            (echo "uninstall disturbed a pre-existing recipient skill"; exit 1)

      - name: enable + install the demo job for real (Phase 6)
        run: |
          ROOT="${{ runner.temp }}/aios-target"
          python3 install.py --target "$ROOT" --enable-demo
          # idempotent: a second call must be a no-op, not a duplicate entry
          python3 install.py --target "$ROOT" --enable-demo
          bash "$ROOT/scheduler/sync.sh"
          bash "$ROOT/scheduler/sync.sh" --check
          # with a job scheduled for real, --detect must now find this install
          OUT="$(python3 install.py --detect || true)"
          echo "$OUT" | grep -q "install root" || (echo "--detect missed a live install:"; echo "$OUT"; exit 1)
          # scheduler drift: the job vanishes from the manifest while the
          # real crontab/launchd entry still exists -> orphan, check 2 FLAGS
          cp "$ROOT/scheduler/manifest.yml" "${{ runner.temp }}/manifest.yml.bak"
          printf 'jobs: []\n' > "$ROOT/scheduler/manifest.yml"
          OUT="$(python3 install.py --target "$ROOT" --audit --package "$GITHUB_WORKSPACE" || true)"
          echo "$OUT" | grep -q "\[FLAGGED\] check 2:" || \
            (echo "expected check 2 to flag an orphaned scheduler unit; got:"; echo "$OUT"; exit 1)
          cp "${{ runner.temp }}/manifest.yml.bak" "$ROOT/scheduler/manifest.yml"
          OUT="$(python3 install.py --target "$ROOT" --audit --package "$GITHUB_WORKSPACE" || true)"
          echo "$OUT" | grep -q "RESULT: PASS" || \
            (echo "expected a clean audit once the manifest is restored; got:"; echo "$OUT"; exit 1)

      - name: uninstall removes the whole footprint (Phase 7 undo path)
        run: |
          ROOT="${{ runner.temp }}/aios-target"
          python3 install.py --target "$ROOT" --uninstall
          if [ -d "$ROOT" ]; then echo "uninstall left the tree behind"; exit 1; fi

      - name: install-audit — clean chain (Wave 2H, SEED-068/069)
        # Never invoked before this wave: a real memory-mesh/install.sh run,
        # a real --approve claude-md write, and --audit against this
        # checkout as --package. Green here means the receipt/approve/audit
        # chain works end to end, not just the deterministic substrate.
        run: |
          ROOT="${{ runner.temp }}/aios-audit-target"
          PKG="$GITHUB_WORKSPACE"
          python3 install.py --target "$ROOT"
          # SEED-070 ships repo_hygiene scheduled-by-default in the
          # manifest, but a plain install doesn't sync it to real
          # cron/launchd — sync first so check 2 has something to find, same
          # as "enable + install the demo job" does for --target installs.
          # Found the same day as this CI-coverage pass: this call was
          # previously unreachable-in-practice (this workflow has never run
          # in the published ai-os-seed repo's real CI).
          bash "$ROOT/scheduler/sync.sh"
          python3 install.py --target "$ROOT" --audit --package "$PKG"

          mkdir -p "$ROOT/.cc-seed/staged"
          printf '# CLAUDE.md\n\nCI test workspace.\n' > "$ROOT/.cc-seed/staged/claude-md.proposed"
          python3 install.py --target "$ROOT" --approve claude-md
          grep -q "CI test workspace" "$ROOT/CLAUDE.md"
          python3 install.py --target "$ROOT" --audit --package "$PKG"

          python3 install.py --target "$ROOT" --approve mesh-bootstrap
          python3 install.py --target "$ROOT" --audit --package "$PKG"
          python3 install.py --target "$ROOT" --audit --package "$PKG" --json | python3 -c "import json,sys; r=json.load(sys.stdin); assert r['result']=='PASS', r"

      - name: install-audit — empty pre-existing CLAUDE.md must not false-flag (F5 fix, 2026-08-06 Gemini review)
        # A 0-byte pre-existing CLAUDE.md still gets a baseline entry (hash
        # of b""), but _approve_claude_md never prepends the "\n\n"
        # separator to nothing — before check 3's fix, a byte-perfect
        # --into install over an empty CLAUDE.md incorrectly FLAGGED
        # "content outside the region does not match the pre-install
        # baseline".
        run: |
          WS="${{ runner.temp }}/f5-empty-claude-md"
          PKG="$GITHUB_WORKSPACE"
          mkdir -p "$WS"
          touch "$WS/CLAUDE.md"
          python3 install.py --target "$WS" --into
          mkdir -p "$WS/.cc-seed/staged"
          printf 'proposed addition\n' > "$WS/.cc-seed/staged/claude-md.proposed"
          python3 install.py --target "$WS" --approve claude-md
          bash "$WS/scheduler/sync.sh"  # SEED-070's default-scheduled repo_hygiene isn't synced by --into alone
          OUT="$(python3 install.py --target "$WS" --audit --package "$PKG" || true)"
          echo "$OUT" | grep -q "RESULT: PASS" || \
            (echo "expected a clean audit for a byte-perfect install over a 0-byte pre-existing CLAUDE.md; got:"; \
             echo "$OUT"; exit 1)

      - name: install-audit — refuses a dirty --package as reference
        run: |
          ROOT="${{ runner.temp }}/aios-audit-dirty-pkg"
          DIRTY="${{ runner.temp }}/dirty-pkg"
          cp -a "$GITHUB_WORKSPACE" "$DIRTY"
          echo "tampered" >> "$DIRTY/install.py"
          python3 install.py --target "$ROOT"
          if python3 install.py --target "$ROOT" --audit --package "$DIRTY"; then
            echo "expected --audit to refuse a dirty --package"; exit 1; fi
          OUT="$(python3 install.py --target "$ROOT" --audit --package "$DIRTY" 2>&1 || true)"
          echo "$OUT" | grep -qi "dirty" || \
            (echo "dirty-package refusal reason not reported; got:"; echo "$OUT"; exit 1)

      - name: install-audit — negative fixtures (each must FLAG the right check, not just exit nonzero)
        run: |
          ROOT="${{ runner.temp }}/aios-audit-neg"
          PKG="$GITHUB_WORKSPACE"
          python3 install.py --target "$ROOT"
          bash "$ROOT/scheduler/sync.sh"  # SEED-070's default-scheduled repo_hygiene needs syncing before check 2 can PASS

          # F6 fix (2026-08-06 Gemini review): assert_flagged used to check
          # only the check ID, so a check FLAGGED for the WRONG reason (e.g.
          # a false-positive on an unrelated fixture) still passed CI. An
          # optional third arg now requires that specific reason text appear
          # in the flag's own detail line, not just any FLAGGED under the
          # right ID.
          assert_flagged() {
            CHECK="$1"
            REASON="${2:-}"
            OUT="$(python3 install.py --target "$ROOT" --audit --package "$PKG" || true)"
            echo "$OUT" | grep -q "\[FLAGGED\] check $CHECK:" || \
              (echo "expected check $CHECK to be FLAGGED; got:"; echo "$OUT"; exit 1)
            if [ -n "$REASON" ]; then
              echo "$OUT" | grep -qi -- "$REASON" || \
                (echo "expected check $CHECK's flag to mention '$REASON'; got:"; echo "$OUT"; exit 1)
            fi
          }

          assert_passed() {
            CHECK="$1"
            OUT="$(python3 install.py --target "$ROOT" --audit --package "$PKG" || true)"
            echo "$OUT" | grep -Eq "\[ *PASS\] check $CHECK:" || \
              (echo "expected check $CHECK to PASS; got:"; echo "$OUT"; exit 1)
          }

          # 1a. modified shipped file -> check 1
          cp "$ROOT/_lib/secrets.py" "${{ runner.temp }}/secrets.py.orig"
          echo "# tampered" >> "$ROOT/_lib/secrets.py"
          assert_flagged 1 "content differs"
          cp "${{ runner.temp }}/secrets.py.orig" "$ROOT/_lib/secrets.py"

          # 1b. mode bit changed on a shipped file -> check 1
          chmod +x "$ROOT/_lib/secrets.py"
          assert_flagged 1 "mode changed"
          chmod 644 "$ROOT/_lib/secrets.py"

          # 1c. shipped file replaced by a symlink -> check 1
          rm "$ROOT/_lib/secrets.py"
          ln -s /etc/hostname "$ROOT/_lib/secrets.py"
          assert_flagged 1 "type changed"
          rm "$ROOT/_lib/secrets.py"
          cp "${{ runner.temp }}/secrets.py.orig" "$ROOT/_lib/secrets.py"

          # 1d. unexpected extra file with no source -> check 1
          echo "surprise" > "$ROOT/not_shipped_by_anyone.txt"
          assert_flagged 1 "UNEXPECTED"
          rm "$ROOT/not_shipped_by_anyone.txt"

          OUT="$(python3 install.py --target "$ROOT" --audit --package "$PKG" || true)"
          echo "$OUT" | grep -q "RESULT: PASS" || \
            (echo "fixtures did not fully revert to a clean state; got:"; echo "$OUT"; exit 1)

          # 3a. malformed/duplicate CLAUDE.md markers -> check 3
          printf '<!-- cc-seed:start -->\nx\n<!-- cc-seed:end -->\n<!-- cc-seed:start -->\ny\n<!-- cc-seed:end -->\n' > "$ROOT/CLAUDE.md"
          assert_flagged 3 "malformed markers"
          rm "$ROOT/CLAUDE.md"

          # 3b. approved region tampered after approval -> check 3
          mkdir -p "$ROOT/.cc-seed/staged"
          printf 'original approved content\n' > "$ROOT/.cc-seed/staged/claude-md.proposed"
          python3 install.py --target "$ROOT" --approve claude-md
          python3 -c "t = open('$ROOT/CLAUDE.md').read().replace('original approved content', 'original approved content\ninjected'); open('$ROOT/CLAUDE.md', 'w').write(t)"
          assert_flagged 3 "does not match the approved hash"

          # 2. scheduler/sync.py edited directly -> check 2 refuses to execute
          # it rather than running unverified code as part of a read-only
          # audit (Wave 2H-2, F2 fix — the flag message itself, not just a
          # nonzero exit, must prove this was a refusal, not an executed-and-
          # then-diffed drift report)
          cp "$ROOT/scheduler/sync.py" "${{ runner.temp }}/sync.py.orig"
          echo "# tampered" >> "$ROOT/scheduler/sync.py"
          assert_flagged 2 "refusing to execute"
          cp "${{ runner.temp }}/sync.py.orig" "$ROOT/scheduler/sync.py"
          assert_passed 2

          # 7. receipt.json edited directly on disk (bypassing install.py,
          # e.g. an agent forging its own baseline entry) -> check 7 (Wave
          # 2H-2, F1 fix). The out-of-target anchor a same-uid --target-
          # scoped agent can't also write is what catches this.
          cp "$ROOT/.cc-seed/receipt.json" "${{ runner.temp }}/receipt.json.orig"
          python3 -c "import json; p='$ROOT/.cc-seed/receipt.json'; r=json.load(open(p)); r['baseline']['forged-by-agent.txt']={'type':'file','mode':'0o644','size':0,'hash':'sha256:'+'0'*64}; json.dump(r, open(p,'w'), indent=2, sort_keys=True)"
          assert_flagged 7 "edited directly rather than through install.py"
          cp "${{ runner.temp }}/receipt.json.orig" "$ROOT/.cc-seed/receipt.json"
          assert_passed 7

      # --- SEED-080: the memory contract, and the origin rule ---------------
      # What CI can prove without a harness, a network or a secret: the door,
      # the store, the fold's projection and the mesh's own breakage report.
      # M1's harness turn, M4's delivery and M5's citation need a real agent
      # CLI, so they are SKIPped BY NAME here and proven by the daily drill on
      # a host that has one. A SKIP is an unmet proof obligation, never a pass.
      - name: memory contract (script half) + the hook approval round trip
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${{ runner.temp }}/mem-root"
          rm -rf "$ROOT"
          python3 install.py --target "$ROOT"

          # The hooks are wired by the SAME --approve shape a human uses; CI
          # never gets a --yes flag of its own, because a flag meaning "skip
          # the human" is one typo from being passed by one.
          CI=true python3 install.py --target "$ROOT" --approve memory-hooks --apply
          grep -q "memory-mesh/retrieve.py" "$ROOT/.claude/settings.json"

          # The contract itself. No --harness: the harness properties report
          # SKIP by name, and the run must still be green on the rest.
          OUT="$(python3 "$ROOT/memory-mesh/contract_test.py" --json "${{ runner.temp }}/contract.json" 2>&1 || true)"
          echo "$OUT"
          echo "$OUT" | grep -q "0 fail" || (echo "contract has failures"; exit 1)
          python3 - "${{ runner.temp }}/contract.json" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          fails = [r for r in d["results"] if r["status"] == "FAIL"]
          skips = [r["property"] for r in d["results"] if r["status"] == "SKIP"]
          assert not fails, fails
          # Every skip must be a HARNESS skip. A skip anywhere else means a
          # property silently stopped being checked.
          assert all("harness" in s for s in skips), skips
          print(f"contract: {len(d['results']) - len(skips)} proven, skipped here: {skips}")
          PY

          # --revoke puts settings.json back exactly, and the contract notices.
          #
          # Both guards below are `if`, not `cmd && (...; exit 1) || true`.
          # That older shape CANNOT FAIL: the parse is `(A && B) || true`, so
          # the subshell's exit 1 is swallowed by the trailing `|| true` and
          # the step goes green having printed its own alarm. Measured
          # 2026-09-18 — `true && (echo X; exit 1) || true` exits 0. Two
          # negative controls sat decorative here, which is the failure mode
          # the contract exists to catch, one level up.
          CI=true python3 install.py --target "$ROOT" --revoke memory-hooks --apply
          if grep -q "memory-mesh/retrieve.py" "$ROOT/.claude/settings.json"; then
            echo "revoke left the hook entries behind"; exit 1
          fi
          if python3 "$ROOT/memory-mesh/contract_test.py" --only M4; then
            echo "M4 passed with no hooks wired — the contract is not measuring delivery"
            exit 1
          fi

      - name: origin rule — same body defers, different body refuses
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${{ runner.temp }}/origin-root"
          rm -rf "$ROOT" "$HOME/.claude/skills/improve"
          mkdir -p "$HOME/.claude/skills/improve"

          # SAME body at user scope -> defer, register nothing, record it.
          cp skills/improve/SKILL.md "$HOME/.claude/skills/improve/SKILL.md"
          OUT="$(python3 install.py --target "$ROOT")"
          echo "$OUT" | grep -q "deferring to it" || (echo "$OUT"; exit 1)
          test ! -e "$ROOT/.claude/skills/improve/SKILL.md"
          python3 -c "
          import json,sys
          r=json.load(open('$ROOT/.cc-seed/receipt.json'))
          d=[x['name'] for x in r['install'].get('deferred_skills',[])]
          assert 'improve' in d, d"

          # The deferral is re-checked at audit time: edit the twin, audit reds.
          echo "changed after the deferral" >> "$HOME/.claude/skills/improve/SKILL.md"
          python3 install.py --target "$ROOT" --audit --package . 2>&1 | \
            grep -q "has CHANGED since the deferral" || \
            (echo "audit did not notice the user-scope twin moving"; exit 1)

          # DIFFERENT body at user scope -> refuse, loudly, naming both paths.
          ROOT2="${{ runner.temp }}/origin-root-2"
          rm -rf "$ROOT2"
          printf -- "---\nname: improve\n---\na different skill entirely\n" > "$HOME/.claude/skills/improve/SKILL.md"
          OUT="$(python3 install.py --target "$ROOT2" 2>&1)"
          echo "$OUT" | grep -q "REFUSING to register" || (echo "$OUT"; exit 1)
          echo "$OUT" | grep -q "$HOME/.claude/skills/improve/SKILL.md" || (echo "refusal did not name the user-scope file"; exit 1)
          test ! -e "$ROOT2/.claude/skills/improve/SKILL.md"
          rm -rf "$HOME/.claude/skills/improve"
